<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber</title>
    <style>
        *{
            margin: 0;

        }
        .nav{
            height: 75px;
            width: 100%;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            background-color: lightgray;
        }
        .ride{
            height: 350px;
            width: 400px;
            border: 1px solid black;
            border-radius: 20px;
            box-shadow: 2px 2px 10px gray;
            margin-top: 50px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: beige;
            
            
            
        }
        button{
            color: white;
            background-color: black;
            border-radius: 5px;
            padding: 5px 55px;

        }
        input{
            border-radius: 5px;
            padding: 5px 20px 5px 2px;
        }
        img{
            height: 250px;
            transition: all 1s ease;
            
        }

        img:hover{
            transform: scale(1.3) translate(100px , 100px) ;
        }
    </style>
</head>
<body>
    <div class="nav">
        <h1>Uber</h1>
    </div>
    <div class="container">
        <div class="ride">
            <img src="https://cn-geo1.uber.com/image-proc/crop/resizecrop/udam/format=auto/width=552/height=368/srcb64=aHR0cHM6Ly90Yi1zdGF0aWMudWJlci5jb20vcHJvZC91ZGFtLWFzc2V0cy8yYzdmYTE5NC1jOTU0LTQ5YjItOWM2ZC1hM2I4NjAxMzcwZjUucG5n" alt="Bike">
            <h3>BIKE</h3>
            <input type="text" placeholder="Enter KM">
            <br>
            <Button>Book now</Button>

        </div>
        <div class="ride">
            <img src="https://cn-geo1.uber.com/image-proc/crop/resizecrop/udam/format=auto/width=552/height=368/srcb64=aHR0cHM6Ly90Yi1zdGF0aWMudWJlci5jb20vcHJvZC91ZGFtLWFzc2V0cy8xZGRiOGM1Ni0wMjA0LTRjZTQtODFjZS01NmExMWEwN2ZlOTgucG5n" alt="Auto">
            <h3>AUTO</h3>
            <input type="text" placeholder="Enter KM">
            <br>
            <Button>Book now</Button>
        </div>
        <div class="ride">
            <img src="https://cn-geo1.uber.com/image-proc/crop/resizecrop/udam/format=auto/width=552/height=368/srcb64=aHR0cHM6Ly90Yi1zdGF0aWMudWJlci5jb20vcHJvZC91ZGFtLWFzc2V0cy9lMDI1OTA1Yy00M2JkLTQ3OTctOTFlNi0yOWQwYWU5Y2I0OGQucG5n" alt="Car">
            <h3>CAB</h3>
            <input type="text" placeholder="Enter KM">
            <br>
            <Button>Book now</Button>

        </div>
    </div>
    
</body>

</html>
