<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registraion Form</title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend> </legend>
            <table>
                <tr>
                    <td>
                        <label for="name">FirstName </label>
                    </td>
                    <td>
                        <input type="text" name="name" id="name" maxlength="20">(max 20 char a-z and A-Z)
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="name">LastName </label>
                    </td>
                    <td>
                        <input type="text" name="name" id="name" maxlength="20">(max 20 char a-z and A-Z)
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="dob">Date of Birth </label>
                    </td>
                    <td>
                        <input type="date" name="dob" id="dob"> 
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="gender" >Gender</label>
                    </td>
                    <td>
                        <input type="radio" id="gender">Male
                        <input type="radio" id="gender">Female 
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="email">Email ID</label>
                    </td>
                    <td>
                        <input type="email" name="email" id="email">
                    </td>
                </tr>
                <tr>
                    <td><label for="Mobile">MOBILE NO</label></td>
                    <td><input type="tel" name="Mobile" id="Mobile" maxlength="10"></td>
                </tr>
                <tr>
                    <td><label for="Address">ADDRESS</label></td>
                    <td><textarea name="Address" id="Address"></textarea></td>
                </tr>
                <tr>
                    <td><label for="City">CITY</label></td>
                    <td><input type="text " id="City"></td>
                </tr>
                <tr>
                    <td><label for="pin">PINCODE</label></td>
                    <td><input type="number" maxlength="6"> (6 digit number)</td>
                </tr>
                <tr>
                    <td><label for="state">STATE</label></td>
                    <td><input type="text" id="state"></td>
                </tr>
                <tr>
                    <td><label for="country">COUNTRY</label></td>
                    <td><input type="text" id="country"></td>
                </tr>
                <tr>
                    <td rowspan="2"><label for="Hobbie">HOBBIES</label></td>
                    <td>
                        <input type="checkbox" id="Hobbie">Drawing
                        <input type="checkbox" id="Hobbie">Singing
                        <input type="checkbox" id="Hobbie">Dancing
                    </td>    
                </tr>
                <tr>
                    <td>
                        <input type="checkbox" id="Hobbie">Others
                        <input type="text" id="Hobbie">
                    </td>
                </tr>
                <tr>
                    <td ><label for="Qualification">Qualifications</label></td>
                    <td>
                        <table>
                            <tr>
                               <td>sl.no</td>
                               <td>Examination</td>
                               <td>Board</td>
                               <td>Percentage</td>
                               <td>year of Pass</td>
                            </tr>
                            <tr>
                                <td>1</td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>
                            <tr>
                                <td>4</td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td ><label for="corse">COURSES APPLIED FOR</label></td>
                    <td >
                        <input type="checkbox" id="corse">BCA
                        <input type="checkbox" id="corse">BSC
                        <input type="checkbox" id="corse">BCOM
                        <input type="checkbox" id="corse">BA
                    </td>
                </tr>
                <tr>
                        <td colspan="2">
                            <center>
                                <button>Submit</button>
                                <button>Reset</button>
                            </center>
                        </td>
                </tr>


            </table>
        </fieldset>
    </form>
</body>
</html>
